<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#15803d" />
    </linearGradient>
    <linearGradient id="brownGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b45309" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" rx="40" fill="url(#bgGrad)" />

  <g transform="translate(40, 40)">
    <!-- Bamboo Weave Background Element -->
    <path d="M160 50 L260 150 L160 250 L60 150 Z" fill="none" stroke="url(#brownGrad)" stroke-width="12" stroke-linejoin="round" />
    <path d="M160 90 L220 150 L160 210 L100 150 Z" fill="none" stroke="url(#leafGrad)" stroke-width="12" stroke-linejoin="round" />
    <path d="M160 130 L180 150 L160 170 L140 150 Z" fill="none" stroke="url(#brownGrad)" stroke-width="12" stroke-linejoin="round" />

    <!-- Main Bamboo Leaf/Shoot overlapping -->
    <path d="M160 20 C260 20 300 100 300 200 C300 300 260 300 160 300 C60 300 20 300 20 200 C20 100 60 20 160 20 Z" fill="none" stroke="url(#leafGrad)" stroke-width="16" />
    
    <!-- Decorative cuts to mimic weave/leaves -->
    <path d="M80 100 C120 140 160 180 240 140" fill="none" stroke="url(#brownGrad)" stroke-width="10" stroke-linecap="round" />
    <path d="M100 220 C140 180 200 160 250 200" fill="none" stroke="url(#leafGrad)" stroke-width="10" stroke-linecap="round" />
    <path d="M160 50 L160 270" fill="none" stroke="url(#leafGrad)" stroke-width="14" stroke-linecap="round" />
  </g>
</svg>
